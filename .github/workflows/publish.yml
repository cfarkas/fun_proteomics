name: Publish Python package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    env:
      R_LIBS: ${{ github.workspace }}/.runtime/R-library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build checked distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/validate_distribution.py
          python -m pip install dist/*.whl
          sudo apt-get update
          sudo apt-get install -y r-base r-base-dev r-bioc-limma r-bioc-edger r-cran-jsonlite r-cran-statmod r-cran-data.table
          bash scripts/install_differential_tools.sh /usr/bin/Rscript
      - name: Test the installed package
        env:
          FUN_PROTEOMICS_TEST_INSTALLED: '1'
          PROTEOMICS_RSCRIPT: /usr/bin/Rscript
        run: |
          python -m unittest discover -s tests -p test_package_cli.py -v
          python tests/run_package_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  publish:
    needs: build_and_test
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/fun-proteomics/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
